
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vericore-ai-service"
version = "0.1.0"
description = "Multimodal enterprise knowledge intelligence and AI processing service"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py315"
