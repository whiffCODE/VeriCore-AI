
name: Bug report
description: Report a reproducible problem in VeriCore AI.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.
        Please provide enough detail to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What happened?
      placeholder: Describe the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide clear, numbered steps.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web application
        - Application API
        - AI service
        - Document ingestion
        - Retrieval and search
        - Evidence and citations
        - Authentication and security
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions and operating system.
      placeholder: |
        OS:
        Node.js:
        Python:
        Browser:
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have removed passwords, tokens, and private data.
          required: true
